[project]
name = "ocpp-2w-proxy"
version = "0.2.0"
description = "A 2 way OCPP 1.6J proxy: one charger, a primary (control) and a secondary (billing) backend"
requires-python = ">=3.14"
dependencies = [
    "websockets>=14",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = [".", "tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

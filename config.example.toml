# ocpp-2w-proxy configuration (copy to config.toml and edit).
# Secrets are never written here: every *_env key names an environment variable.

[proxy]
listen = "0.0.0.0"
port = 8321
# Transaction id mapping and the offline queues live here.
# Must be persistent (a Docker volume / TrueNAS dataset).
state_dir = "/data"
# Optional: let the proxy terminate TLS itself. Leave empty when a reverse proxy
# (e.g. Nginx Proxy Manager) terminates TLS in front of it.
tls_cert = ""
tls_key = ""
ping_interval = 30
ping_timeout = 60

[logging]
level = "INFO"          # DEBUG, INFO, WARNING, ERROR, CRITICAL
# At DEBUG, also log (redacted) payloads. RFID tags are masked; credentials never logged.
log_payloads = false

# Allowlist: only these chargers may connect. The charger connects to <proxy-url>/<id>
# and sends <id> as Basic-auth username.
[[chargers]]
id = "CHANGE-ME"
# Optional: require this password from the charger (set the same in the charger's OCPP settings).
# password_env = "CHARGER_PASSWORD"
# Optional: the id each backend knows this charger by (defaults to id).
# primary_id = "CHANGE-ME"
# Per secondary backend (defaults to id):
# [chargers.secondary_ids]
# homeassistant = "CHANGE-ME"

# Primary = the backend in charge (Tap Electric): card authorization, transaction
# numbers and remote starts come from here. Its replies are what the charger sees.
# The charger sees the primary's availability: it must be reachable to start a session,
# and an outage longer than outage_grace closes the charger connection, so the charger
# goes offline and queues/authorizes by its own OCPP offline rules until the primary is back.
# During the grace period the proxy queues StopTransaction and the MeterValues of a
# transaction, keeps only the newest StatusNotification per connector, answers heartbeats
# itself and drops other meter readings. A message that needs the primary's own answer
# (Authorize, StartTransaction, ...) waits up to call_timeout for the primary; if it cannot
# be answered the charger connection is closed unanswered, so the charger keeps it and resends.
[primary]
url = "wss://CHANGE-ME"   # the charger id is appended: <url>/<primary_id>
# none    : no credentials
# forward : pass the charger's own Authorization header (only if the backend needs the charger's password)
# basic   : primary_id + password from password_env
auth = "none"
# password_env = "PRIMARY_PASSWORD"
call_timeout = 30
# Seconds a primary outage is hidden from the charger before its connection is closed (0 = at once).
outage_grace = 30
# Max queued transaction messages while the primary backend is unreachable (minimum 10000).
# When it overflows, MeterValues are dropped first, then the oldest message.
max_queue = 10000

[primary.policy]
# Everything is forwarded by default. An Exclusive Command (charging profile,
# configuration, availability, reset, firmware, local list, reservations, data
# transfer, remote start) may be forwarded by at most ONE backend: to hand one to
# the secondary, take it away from the primary here, and the proxy checks at
# startup that exactly one backend has it.
actions = { SetChargingProfile = "answer", ClearChargingProfile = "answer" }
# Optional: remove chargingProfile from RemoteStartTransaction before forwarding,
# so a remote start cannot override the charging schedule the secondary backend sets.
# strip_charging_profile = true

# Secondary backends: zero or more, each a [[secondary]] entry with a unique name
# ("primary" is reserved) that shows up in logs and errors. Remove all of them for a 1-way proxy.
# This one is the solar/control backend (HomeAssistant): it sees the messages below, may stop
# sessions and - once assigned above - set charging profiles, but may never change
# authorization, configuration, availability or firmware, and never starts sessions.
[[secondary]]
name = "homeassistant"
url = "wss://CHANGE-ME"   # <url>/<secondary_ids.homeassistant or charger id>
auth = "none"             # none | basic   ('forward' is refused: it would leak charger credentials)
# password_env = "SECONDARY_PASSWORD"
call_timeout = 30
# Calls from the charger that are also sent to this backend.
forward_actions = [
    "BootNotification",
    "Heartbeat",
    "StatusNotification",
    "Authorize",
    "StartTransaction",
    "StopTransaction",
    "MeterValues",
]
# Max queued transaction messages while this backend is unreachable (minimum 10000).
# A queued message this backend answers with an OCPP error is retried with a growing
# delay and dropped (logged) after 5 errors in a row.
max_queue = 10000

[secondary.policy]
# Commands from this backend to the charger. Defaults:
#   forward: RemoteStopTransaction, TriggerMessage, GetConfiguration, UnlockConnector,
#            GetCompositeSchedule
#   answer : RemoteStartTransaction, GetLocalListVersion, SendLocalList, ChangeConfiguration,
#            SetChargingProfile, ClearChargingProfile, ChangeAvailability, Reset, ClearCache,
#            ReserveNow, CancelReservation, DataTransfer, UpdateFirmware, GetDiagnostics
#   anything else: error (NotSupported)
# Remote start, local list and reservations are Authorization Commands: the proxy
# refuses to start if a secondary backend is configured to forward one.
actions = { SetChargingProfile = "forward", ClearChargingProfile = "forward" }
# ChangeConfiguration keys this backend owns (empty: none), e.g. a power or current limit.
# The primary still changes every other key, but its changes to these keys are answered
# "Rejected" by the proxy. Keys that change the charger's authorization behavior or its
# credentials (e.g. LocalAuthListEnabled, AuthorizationKey) are refused.
change_configuration_allow_keys = []

# A statistics backend only needs meter data: add it as another [[secondary]] entry
# (with its own [[secondary]] and [secondary.policy] blocks).
# [[secondary]]
# name = "stats"
# url = "wss://CHANGE-ME"
# auth = "basic"
# password_env = "STATS_PASSWORD"
# forward_actions = ["BootNotification", "MeterValues", "StopTransaction"]

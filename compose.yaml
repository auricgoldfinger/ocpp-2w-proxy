# TrueNAS SCALE: Apps -> Discover Apps -> Custom App -> "Install via YAML" and paste this,
# or run it with `docker compose up -d`. Adjust the host paths and the LAN IP.
services:
  ocpp-2w-proxy:
    image: ocpp-2w-proxy:0.3.0
    pull_policy: never          # image is loaded manually with `docker load`
    container_name: ocpp-2w-proxy
    restart: unless-stopped
    user: "568:568"
    ports:
      # Bind to the NAS's LAN IP only; never forward this port on your router.
      - "192.168.1.10:8321:8321"
    environment:
      - TZ=Europe/Amsterdam
      - SECONDARY_PASSWORD=change-me     # Tap OCPP password
      # - CHARGER_PASSWORD=change-me     # if [[chargers]] password_env is set
    volumes:
      - /mnt/tank/apps/ocpp-2w-proxy/config:/config:ro
      - /mnt/tank/apps/ocpp-2w-proxy/data:/data
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
